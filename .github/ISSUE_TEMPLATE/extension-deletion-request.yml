name: 🗑️ Request extension deletion
you can't manage
title: "[delete] <extension id>"
labels: ["deletion-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request deletion of an extension you cannot delete from the
        gallery's own manage page
        or otherwise needs admin attention.

        If you're the publisher
        &mdash; it's instant.

        Put the extension ID in the issue title above (e.g. `[delete] Author.ExtensionName`).

  - type: input
    id: extension-url
    attributes:
      label: Extension URL
      description: Direct link to the extension page on the gallery.
      placeholder: https://www.vsixgallery.com/extension/Author.ExtensionName
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for deletion
      description: Why should this extension be removed? Helps us prioritize and decide whether a soft-delete is enough or a hard-delete is warranted.
      placeholder: |
        e.g. "Project is discontinued", "Replaced by <new-id>", "Accidental upload",
             "Contains malware", "Abusive content", "Trademark / copyright violation", ...
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand that deleted extensions stop appearing in the gallery and are permanently purged after the retention period.
          required: true
