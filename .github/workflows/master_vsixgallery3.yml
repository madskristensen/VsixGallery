# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build, test, and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ./VsixGallery.sln --locked-mode

      - name: Test
        run: >-
          dotnet test ./VsixGallery.sln -c Release --no-restore
          --collect:"XPlat Code Coverage"
          --settings ./tests/coverage.runsettings
          --results-directory ./TestResults

      - name: Enforce coverage floor
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if len(reports) != 1:
              raise SystemExit(f"Expected one coverage report, found {len(reports)}")

          coverage = ET.parse(reports[0]).getroot()
          line = float(coverage.attrib["line-rate"]) * 100
          branch = float(coverage.attrib["branch-rate"]) * 100
          print(f"Coverage: {line:.1f}% lines, {branch:.1f}% branches")
          if line < 50 or branch < 30:
              raise SystemExit("Coverage fell below the 50% line / 30% branch floor")
          PY

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish ./src/VsixGallery.csproj -c Release --no-restore -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: .net-app-${{ github.run_id }}
          path: ${{ env.DOTNET_ROOT }}/myapp
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: vsixgallery-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: .net-app-${{ github.run_id }}

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_77829130ADA14A26970D5F27791524F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44B9B6511BAB4B96BBF695A676240B81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4C6A518E4FDC4288990623736F262B51 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'vsixgallery3'
          slot-name: 'Production'
          package: .

      - name: Smoke test deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            https://www.vsixgallery.com/health/ready
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://www.vsixgallery.com/ > /dev/null
