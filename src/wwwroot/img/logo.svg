<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 2x2 grid: padding=30, gap=16, slot=90px -->
  <!-- Top-left square -->
  <rect x="30"  y="30"  width="90" height="90" rx="6" fill="#0090FF"/>
  <!-- Bottom-left square -->
  <rect x="30"  y="136" width="90" height="90" rx="6" fill="#0090FF"/>
  <!-- Bottom-right square -->
  <rect x="136" y="136" width="90" height="90" rx="6" fill="#0090FF"/>
  <!-- Top-right diamond: full 90×90 rotated 45°, center at (181,75) -->
  <rect x="136" y="30"  width="90" height="90" rx="6" fill="#A8D4FF" transform="rotate(45 181 75)"/>
</svg>
