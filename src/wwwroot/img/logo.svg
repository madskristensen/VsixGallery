<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Uniform 2x2 grid: slot=111px, padding=10, gap=14 -->
  <!-- Top-left square -->
  <rect x="10"  y="10"  width="111" height="111" rx="20" fill="#0090FF"/>
  <!-- Bottom-left square -->
  <rect x="10"  y="135" width="111" height="111" rx="20" fill="#0090FF"/>
  <!-- Bottom-right square -->
  <rect x="135" y="135" width="111" height="111" rx="20" fill="#0090FF"/>
  <!-- Top-right diamond: pre-rotation square = 111/√2 ≈ 78.5, centered at (190, 65) -->
  <rect x="151" y="26" width="79" height="79" rx="14" fill="#A8D4FF" transform="rotate(45 190.5 65.5)"/>
</svg>
